name: Feature request
description: Something OpenRex could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What you'd like
      description: The problem it solves for you, and how you'd expect it to work.
    validations:
      required: true
  - type: textarea
    id: rex
    attributes:
      label: How Rex does it
      description: If Rex.app or the Rex API already has this (an action name, a method, an event), say which. OpenRex follows Rex's names so one init.lua works in both.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself
