name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # This name is the required status check on main. Rename both together.
    name: Build, test, lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev libvulkan-dev

      # Zig, pinned in mise.toml, builds Ghostty's terminal engine.
      - uses: jdx/mise-action@v4

      # Ghostty's build script runs Zig from its own directory, where the mise
      # shim can't see mise.toml, so name the installed binary directly.
      - name: Point the build at Zig
        run: echo "ZIG=$(mise which zig)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        # Tests that need a running Rex server are #[ignore]d and skipped here.
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked
