[package]
name = "openrex"
version = "0.1.0"
edition = "2024"
description = "A Linux client for the Rex terminal multiplexer server"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
anyhow = "1.0.104"
env_logger = "0.11.11"
futures = "0.3.34"
ghostty-vt = { version = "0.8.0", features = ["png"] }
gpui = "0.2.2"
image = { version = "0.25.10", default-features = false }
log = "0.4.35"
openrex-proto = { version = "0.1.0", path = "../openrex-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smol = "2.0.2"
