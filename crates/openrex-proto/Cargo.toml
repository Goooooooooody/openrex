[package]
name = "openrex-proto"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
async-net = "2.0.0"
async-tungstenite = "0.35.0"
base64 = "0.23.1"
futures = "0.3.34"
futures-rustls = { version = "0.26.0", default-features = false, features = ["ring", "tls12", "logging"] }
log = "0.4.35"
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
smol = "2.0.2"
