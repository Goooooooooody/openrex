[workspace]
resolver = "3"
members = ["crates/openrex","crates/openrex-proto"]

[workspace.package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Goooooooooody/openrex"
homepage = "https://github.com/Goooooooooody/openrex"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
